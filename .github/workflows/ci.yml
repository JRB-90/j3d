name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by occt-wasm.yml after it commits a new build (GITHUB_TOKEN pushes don't trigger CI).
  # Run by hand with large_fixtures (e.g. "200") to add the on-demand large-model tests (spike S2).
  workflow_dispatch:
    inputs:
      large_fixtures:
        description: Large STEP sizes in MB to generate and import, comma-separated (empty to skip)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Empty unless dispatched with large_fixtures; the large-model tests skip themselves when it is.
  J3D_LARGE_FIXTURES: ${{ inputs.large_fixtures }}

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Git LFS objects (the OCCT WASM) are cached by content to save LFS bandwidth quota.
      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache Git LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch Git LFS objects
        run: git lfs pull

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm workspaces
        run: npm ci

      - name: Check the committed OCCT WASM matches its sources
        run: npm run check:dist --workspace @j3d/occt

      - name: Generate large STEP fixtures
        if: env.J3D_LARGE_FIXTURES != ''
        run: npm run fixtures:large -- ${J3D_LARGE_FIXTURES//,/ }

      - name: Typecheck & test (Vitest, including OCCT integration tests)
        run: |
          npm run typecheck
          npm test

      - name: Build solution
        run: dotnet build J3D.slnx -c Release

      - name: Test client (xUnit + bUnit)
        run: dotnet test --project tests/J3D.Web.Client.Tests -c Release --no-build

      - name: Test host (xUnit + WebApplicationFactory)
        run: dotnet test --project tests/J3D.Web.Tests -c Release --no-build

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      # Git LFS objects (the OCCT WASM) are cached by content to save LFS bandwidth quota.
      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache Git LFS objects
        uses: actions/cache@v6
        with:
          path: .git/lfs/objects
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch Git LFS objects
        run: git lfs pull

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm workspaces
        run: npm ci

      - name: Build E2E tests
        run: dotnet build tests/J3D.E2E.Tests -c Release

      - name: Generate large STEP fixtures
        if: env.J3D_LARGE_FIXTURES != ''
        run: npm run fixtures:large -- ${J3D_LARGE_FIXTURES//,/ }

      - name: Install Playwright browser
        run: pwsh tests/J3D.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps ${{ matrix.browser }}

      # Detailed output includes passing tests' messages, e.g. the large-model timings and heap sizes.
      # Headless Firefox has no WebGL on the runner even with webgl.force-enabled (risk R13), so it
      # runs headed on a virtual display, where Mesa's software renderer provides it (decision D47).
      - name: Run E2E tests
        run: |
          if [ "$BROWSER" = firefox ]; then
            HEADED=1 xvfb-run --auto-servernum dotnet test --project tests/J3D.E2E.Tests -c Release --no-build --output Detailed
          else
            dotnet test --project tests/J3D.E2E.Tests -c Release --no-build --output Detailed
          fi
        env:
          BROWSER: ${{ matrix.browser }}
